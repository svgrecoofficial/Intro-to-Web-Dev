<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
 	<title>Rick and Morty Character Finder</title>
	<link rel="stylesheet" href="project2.css">
	<script src="project2.js"></script>
</head>
<body>
<header>
	<h1>Rick and Morty Character Finder</h1>
</header>

<div class="widgets">
	Character Search -> 
	<input id="searchterm" type="text" size="20" maxlength="20" autofocus value="cats" />
</div>

<div class="widgets">
	Max # results -> 
	<select id="limit">
		<option value="5">5</option>
		<option value="10" selected>10</option>
		<option value="25">25</option>
		<option value="50">50</option>
		<option value="100">100</option>
	</select>
</div>

<div class="widgets">
	<button type="button" id="search" >Rick and Morty Characters!<br>Search Now!</button>
    <button type="button" id="random" >Unsure who to search?<br>Get a Random Character!</button>
</div><hr>
<div id="status">Ready to Search!</div>


<h2>Results</h2>
<div id="content">
	<p>No data yet!</p>
</div>
 

</body>
</html>
