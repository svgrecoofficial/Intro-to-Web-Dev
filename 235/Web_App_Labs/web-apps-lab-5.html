<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-5</title>
	<style>
		body{
			font-family:sans-serif;
		}
		#colorform{
			background-color:#dfecdf;
			color: #111;
			padding:1em;width:400px;
		}
		#colorform p#info{
			background-color:white;
			color: black;
			width:300px;
			height:100px;
			padding:.5em;
		}
		
		#colorform legend{ 
			font-weight:bold;
			font-size:1.2em;
		}
	</style>
</head>
<body>

<div id="colorform">
	<legend>Choose your favorite color!</legend>
	<p><input type="radio" name="colorGroup" id="colorGroupRed" value="red" /> Red</p>
	<p><input type="radio" name="colorGroup" id="colorGroupGreen" value="green" /> Green</p>
	<p><input type="radio" name="colorGroup" id="colorGroupBlue" value="blue" /> Blue</p>
	<p><button id="colorButton" type="button">Submit</button></p>
	<p id="info"></p>
</div>

<script>
/* Write your code here! */

    let info = document.querySelector("#info");
    let buttons = document.querySelectorAll("input[name='colorGroup']");
    let colorButton = document.querySelector("#colorButton");
    let legend = document.querySelector("legend");
    info.innerHTML = "Please select a color";
    
    for(let i = 0; i < buttons.length; i++){
        buttons[i].addEventListener("change", function(){
            if(this.checked){
                info.innerHTML = "You have selected " + this.value + "!";
            }
        })
    }

    colorButton.addEventListener("click", function(){
        for(let i = 0; i < buttons.length; i++){
            if(buttons[i].checked){
                info.innerHTML = "Your FINAL CHOICE is " + buttons[i].value + "!";
                legend.style.color = buttons[i].value;
                break;
            }
        }
    })

        

</script>
</body>
</html>
